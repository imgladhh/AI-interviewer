name: repository-quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  full-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_interviewer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_interviewer"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_interviewer?schema=public
      REDIS_URL: redis://localhost:6379
      ENABLE_CODE_RUNS: "false"
      ENABLE_HOST_CODE_EXECUTION: "false"
      ENABLE_PERSONA_INGESTION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Production dependency audit (critical fails)
        run: npm audit --omit=dev --audit-level=critical
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
